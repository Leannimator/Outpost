<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body data-page="about">
<div class="shop-app">
  <aside class="shop-side">
    <div class="shop-brand">
      <a class="wordmark" id="sn" data-brand="name" href="store.html">Outpost</a>
      <nav><a href="store.html" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>Shop</span></a><a href="auction.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-3 3-6-6 3-3z"/><path d="M11 7l-6 6 3 3 6-6"/><path d="M4 20h9"/></svg><span>Auctions</span></a></nav>
    </div>
    <img class="side-art" data-brand="mascot" alt="" hidden>
  </aside>
  <main class="shop-content">
    <a class="wordmark mobhead" data-brand="name" href="store.html">Outpost</a>
    <section class="revpage" id="page"><p class="muted">Loading…</p></section>
  </main>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LABEL = { website: 'Website', instagram: 'Instagram', tiktok: 'TikTok', facebook: 'Facebook', youtube: 'YouTube', pinterest: 'Pinterest', bluesky: 'Bluesky', threads: 'Threads', email: 'Email' };
  fetch('/api/settings').then((r) => r.json()).then((s) => {
    OutpostBrand.apply(s); document.title = 'About — ' + s.store_name;
    const links = Object.entries(s.social || {}).filter(([k]) => LABEL[k]);
    $('page').innerHTML = `<h1>About ${esc(s.store_name)}</h1>
      ${s.about_text ? s.about_text.split(/\n\s*\n/).map((p) => `<p class="abouttext">${esc(p).replace(/\n/g, '<br>')}</p>`).join('') : '<p class="muted">This shop hasn’t added a description yet.</p>'}
      ${s.handmade_statement ? `<div class="made"><b>Made by hand</b><br>${esc(s.handmade_statement)}</div>` : ''}
      ${links.length ? `<h2 class="aboutfind">Find us</h2><div class="sociallist">${links.map(([k, v]) => `<a class="social" href="${esc(k === 'email' ? 'mailto:' + v : v)}" ${k === 'email' ? '' : 'target="_blank" rel="noopener noreferrer me"'}>${LABEL[k]}</a>`).join('')}</div>` : ''}`;
  }).catch(() => { $('page').innerHTML = '<p>Couldn’t load this page. Please try again.</p>'; });
})();
</script>
</body>
</html>
